# Single source of truth for every setting. Scripts and notebooks read this file,
# so nothing about the experiment is hardcoded elsewhere. The report's hyperparameter
# table is generated from it with: python scripts/print_hparams.py

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/indexes
  output_dir: outputs
  cmv_chains: data/processed/cmv_chains.jsonl
  train_examples: data/processed/train_examples.jsonl
  val_examples: data/processed/val_examples.jsonl
  test_dialogues: data/processed/test_dialogues.jsonl
  passages: data/processed/passages.jsonl              # args.me, the main index
  passages_backup: data/processed/passages_ibm_argq.jsonl  # IBM-ArgQ, kept apart so it cannot crowd out args.me
  adapter_dir: outputs/adapter
  checkpoint_dir: outputs/checkpoints   # training checkpoints for resuming a stopped job, cleared once the adapter is saved
  transcripts_dir: outputs/transcripts
  results_dir: outputs/results
  rating_dir: outputs/human_eval

data:
  split_ratios: [0.8, 0.1, 0.1]   # train / validation / test, split by thread
  min_turns: 3
  max_turns: 6
  bot_reply_max_tokens: 150       # counted in whitespace words, cut at a sentence boundary
  user_turn_max_words: 200        # the poster's long opening post is cut to this, keeps prompts inside max_seq_len
  passage_max_words: 120          # keeps every passage inside the NLI model's 512 token limit

claims:
  max_claims: 5
  dedup_threshold: 0.8            # word-set Jaccard above this counts as the same claim

retrieval:
  method: bm25                    # bm25 or dense
  top_k_retrieve: 10
  top_k_keep: 3
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  backup_index: ibm_argq          # used when args.me results are weak
  use_backup: false               # OFF: on weak queries IBM-ArgQ returned worse evidence than args.me (docs/DATA_NOTES.md)
  backup_min_score: 131.4         # BM25 only: 10th percentile of best args.me scores (scripts/calibrate_backup.py)

prompt:
  max_history_turns: 6
  max_passage_words: 80

generator:
  base_model: Qwen/Qwen3.5-0.8B-Base
  # Precision the model is loaded in for generation: auto, bfloat16, float16 or float32.
  # auto means "whatever the model ships in" (bf16 for Qwen3.5), which is what every 0.8B run so far used.
  dtype: auto
  # Approved by the professor earlier. For gpt2-medium set lora.target_modules to [c_attn]
  # and training.max_seq_len to 1024 or lower (its context window).
  fallback_model: gpt2-medium

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear      # Qwen3.5 mixes Gated DeltaNet and attention layers

training:
  max_seq_len: 1024
  per_device_batch_size: 4        # fits with gradient checkpointing; drop to 2 (grad_accum 8) if a shared card OOMs
  grad_accum_steps: 4             # effective batch = per_device_batch_size x this = 16
  eval_batch_size: null           # validation batch; null means the same as per_device_batch_size
  learning_rate: 2.0e-4
  num_epochs: 3
  # 0.0 because that is what the 0.8B adapter really got: transformers 5.x renamed this setting to
  # warmup_steps and the old train() dropped it with a one-line "does not accept" note. Keeping 0.0
  # records what happened and keeps the 4B run the same. train() now passes the value through.
  warmup_ratio: 0.0
  # fp16, bf16 or fp32. The 0.8B adapter was trained in fp16 because a Colab T4 has no bf16.
  # Any cluster card (3090, A40, L40S, H100) can do bf16, which is safer for bigger models.
  precision: fp16
  p_blank_claims: 0.25            # slot blanking so one adapter serves all five systems
  p_blank_evidence: 0.25
  max_train_examples: null        # set a number if the full set will not fit in the Colab time limit
  # Checkpoints, so a job that hits the 24 h limit or gets preempted can carry on where it stopped.
  save_steps: 100                 # optimizer steps between checkpoints (each step = one effective batch of 16)
  save_total_limit: 2             # keep only the newest two checkpoints
  resume: true                    # pick up from the newest checkpoint in paths.checkpoint_dir if there is one
  oom_fallback: true              # on out-of-memory, halve the batch and double grad_accum (same effective batch)

decoding:
  temperature: 0.8
  top_p: 0.9
  max_new_tokens: 150
  n_candidates_rerank: 5          # only system D uses more than one candidate

nli:
  model: roberta-large-mnli
  contradiction_threshold: 0.5
  max_length: 512
  min_reply_words: 5              # the reranker ignores replies shorter than this (claim-free loophole)

eval:
  n_boot: 10000
  ci_alpha: 0.05
  n_test_debates: 100              # scripted debates every system is run on (scripts/make_test_debates.py)
  human_eval_dialogues_per_system: 20   # 20 of those 100, drawn with the seed
  n_raters: 2
  # The strict contradiction rate (evaluate.py --strict, see src/argubot/eval/metrics.py).
  # threshold and min_similarity are set by scripts/calibrate_strict_metric.py on the 24 labelled
  # pairs and the real CMV replies only, and fixed here before the metric is run on any system.
  strict:
    nli_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli   # not the reranker's model
    similarity_model: sentence-transformers/all-MiniLM-L6-v2
    min_words: 6                  # shorter reply sentences are not judged
    threshold: 0.7                # both NLI directions must reach this (calibrated 27 Oct)
    min_similarity: 0.4           # pairs less similar than this are about different things (calibrated 27 Oct)
