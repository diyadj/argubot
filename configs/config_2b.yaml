# Fallback if the 4B timing test says NO GO: Qwen3.5-2B-Base, set up exactly like the 4B run
# (bf16, its own output folders, no GPT-2 fallback). Use it the same way, with
# --config configs/config_2b.yaml (see docs/UPGRADE_TO_4B.md, "If 4B is too slow").

extends: configs/config.yaml

paths:
  adapter_dir: outputs/adapter_2b
  checkpoint_dir: outputs/checkpoints_2b
  transcripts_dir: outputs/transcripts_2b
  results_dir: outputs/results_2b
  rating_dir: outputs/human_eval_2b

generator:
  base_model: Qwen/Qwen3.5-2B-Base
  dtype: bfloat16
  fallback_model: null

training:
  precision: bf16       # bf16 does not overflow the way fp16 can on a bigger model
  # Same effective batch of 16 as the 0.8B run, split 2 x 8 instead of 4 x 4. Qwen's 248k-word
  # vocabulary makes the logits of a batch of 4 about 4 GB in fp32 (plus as much again for the
  # loss), which does not fit next to the 4B weights on a 24 GB RTX 3090. Splitting the batch
  # changes the memory, not the training.
  per_device_batch_size: 2
  grad_accum_steps: 8
  eval_batch_size: 2
