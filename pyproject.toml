[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "argubot"
version = "0.1.0"
description = "ArguBot: a retrieval-augmented, consistency-tracking debate dialogue system (CS425, G2T3)"
requires-python = ">=3.10"
# Only the light dependencies live here so the tests run anywhere.
# The heavy ML stack is in requirements.txt (Colab already ships most of it).
dependencies = ["pyyaml", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
